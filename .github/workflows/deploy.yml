name: Deploy portfolio
on:
  push:
    branches: [main, master]

  workflow_dispatch:
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXT_PUBLIC_ROOT_DOMAIN: tiendev.id.vn
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-fund --no-audit
      - run: npm run build
      - name: Pack artifact
        run: |
          set -euo pipefail
          cp -R public .next/standalone/public 2>/dev/null || mkdir -p .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          tar -C .next/standalone -czf "${{ github.workspace }}/app.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-release
          path: app.tar.gz
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-release
          path: artifact
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: artifact/app.tar.gz
          target: /tmp/portfolio-release
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_ROOT=/home/tiendev/portfolio PM2_NAME=porfolio RELEASE_ID="${{ github.sha }}" \
            TARBALL=/tmp/portfolio-release/app.tar.gz PM2_SCRIPT=server.js PORT=4004 \
            bash /home/tiendev/bin/deploy-release.sh
            rm -f /tmp/portfolio-release/app.tar.gz
